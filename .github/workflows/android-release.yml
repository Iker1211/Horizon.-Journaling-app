name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js (v22 required for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK 21 (required for Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install web dependencies
        run: npm ci

      - name: 🏗️ Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔐 Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository base64 keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "Generating self-contained release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias horizon-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass "Horizon2027#SecurePass!" \
              -keypass "Horizon2027#SecurePass!" \
              -dname "CN=Horizon App, OU=Mobile, O=Horizon2027, L=Medellin, ST=Antioquia, C=CO"
          fi
          ls -la android/app/release.keystore

      - name: 🔨 Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: 🚨 Handle Failure & Push Diagnostic Log
        if: failure()
        run: |
          echo "### ⚠️ Android Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          git add -f gradle_output.txt
          git commit -m "debug: ci gradle failure output [skip ci]" || true
          git push -f origin ci-debug-log || true

      - name: 📋 Capture Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: gradle_output.txt
          if-no-files-found: ignore

      - name: 📦 Locate and prepare APK
        id: prepare_apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found under android/app/build/outputs/apk/"
            find android/app/build/outputs/ || true
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" "release-output/horizon-${TAG}.apk"
          echo "apk_path=release-output/horizon-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifact to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: release-output/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: Horizon Release ${{ github.ref_name }}
          files: release-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
